apiVersion: apps/v1
kind: Deployment
metadata:
  name: gha-demo
  labels:
    app: gha-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gha-demo
  template:
    metadata:
      labels:
        app: gha-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
